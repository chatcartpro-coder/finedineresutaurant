<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatCart Pro - Setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">ChatCart Pro</div>
    <h1>{{ store_name }}</h1>
    <p class="sub">Create the first admin account to get started.</p>
    <form method="post" action="/admin/setup">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>
      <label for="password">Password (min 8 characters)</label>
      <input type="password" id="password" name="password" required minlength="8">
      <button class="btn btn-primary" type="submit">Create admin account</button>
    </form>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <p class="login-powered-by">AI Powered by <b>Nexsofture Pvt Ltd</b></p>
  </div>
</div>
</body>
</html>
